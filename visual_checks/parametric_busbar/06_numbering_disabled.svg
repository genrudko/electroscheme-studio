<line x1="200" y1="48" x2="200" y2="76" stroke="var(--voltage-color, currentColor)" stroke-width="1.5" vector-effect="non-scaling-stroke" />
<line x1="260" y1="48" x2="260" y2="76" stroke="var(--voltage-color, currentColor)" stroke-width="1.5" vector-effect="non-scaling-stroke" />
<line x1="320" y1="48" x2="320" y2="76" stroke="var(--voltage-color, currentColor)" stroke-width="1.5" vector-effect="non-scaling-stroke" />
<circle cx="80" cy="156" r="3" fill="none" stroke="var(--slot-color, #2563eb)" stroke-width="1" vector-effect="non-scaling-stroke" />
<circle cx="140" cy="156" r="3" fill="none" stroke="var(--slot-color, #2563eb)" stroke-width="1" vector-effect="non-scaling-stroke" />
<circle cx="200" cy="156" r="3" fill="none" stroke="var(--slot-color, #2563eb)" stroke-width="1" vector-effect="non-scaling-stroke" />
<circle cx="260" cy="156" r="3" fill="none" stroke="var(--slot-color, #2563eb)" stroke-width="1" vector-effect="non-scaling-stroke" />
<circle cx="320" cy="156" r="3" fill="none" stroke="var(--slot-color, #2563eb)" stroke-width="1" vector-effect="non-scaling-stroke" />
