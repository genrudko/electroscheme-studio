  <text x="24" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Horizontal busbar — numbering disabled</text>
  <text x="24" y="50" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Checks clean geometry without cell labels.</text>
  <rect x="28" y="68" width="518" height="184" fill="url(#grid)" stroke="#cbd5e1" rx="10"/>
  <g transform="translate(40, 80)" style="color:#4b5563;--voltage-color:#4b5563;--slot-color:#2563eb;--label-color:#111827">
