<circle cx="82" cy="34" r="4" fill="none" stroke="var(--slot-stroke, #ffffff)" stroke-width="1.4" />
<circle cx="130" cy="34" r="4" fill="none" stroke="var(--slot-stroke, #ffffff)" stroke-width="1.4" />
<circle cx="178" cy="34" r="4" fill="none" stroke="var(--slot-stroke, #ffffff)" stroke-width="1.4" />
<circle cx="226" cy="34" r="4" fill="none" stroke="var(--slot-stroke, #ffffff)" stroke-width="1.4" />
<text x="274" y="34" transform="rotate(0 274 34)" font-family="Arial, sans-serif" font-size="16" dominant-baseline="middle" data-role="bus-label" data-draggable="true" data-offset-x="0" data-offset-y="0" data-rotation="0" fill="var(--label-color, #111111)">1С 10 кВ</text>
  </g>
  <text x="24" y="262" font-family="Arial, sans-serif" font-size="11" fill="#64748b">terminals=7; bay_slots=5; viewBox=494x160</text>
