name: Desktop Platform Spike
on:
  push:
    branches: [architecture/desktop-platform-and-core-spike-001]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install exact JavaScript dependencies
        working-directory: spikes
        run: npm install --ignore-scripts
      - name: Verify changed scope
        working-directory: spikes
        env: { SPIKE_BASE_SHA: b95d7111d9c5a36db4c355ee91f742efea8ecc10 }
        run: npm run verify:scope
      - name: Typecheck and canonical core tests
        working-directory: spikes
        run: npm test
      - name: VSDX and VSSX package tests
        working-directory: spikes
        run: python -m unittest tools/test_visio_spike_tool.py -v
      - name: Build shared Vue SVG renderer and Electron boundary
        working-directory: spikes
        run: npm run build
      - name: Generate lock evidence
        working-directory: spikes
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with: { name: desktop-spike-lock-evidence, path: spikes/package-lock.json, if-no-files-found: error }
  candidate-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.97.1 }
      - name: Install Linux Tauri runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb
      - name: Install JavaScript dependencies
        working-directory: spikes
        run: npm install --ignore-scripts
      - name: Build shared renderer and Electron adapter
        working-directory: spikes
        run: npm run build
      - name: Build Tauri executable
        working-directory: spikes/tauri
        run: npx tauri build --no-bundle
      - name: Package Electron executable directory
        working-directory: spikes
        run: npm run package:electron
      - name: Package Tauri portable evidence directory
        working-directory: spikes
        run: npm run package:tauri
      - name: Electron launch smoke (Linux)
        if: runner.os == 'Linux'
        working-directory: spikes
        env: { SPIKE_SMOKE: '1' }
        run: timeout 30s xvfb-run -a ./evidence/generated/electron-package/ElectroSchemeSpikeElectron-linux-x64/ElectroSchemeSpikeElectron
      - name: Tauri launch smoke (Linux)
        if: runner.os == 'Linux'
        working-directory: spikes
        env: { SPIKE_SMOKE: '1', WEBKIT_DISABLE_COMPOSITING_MODE: '1' }
        run: timeout 30s xvfb-run -a ./evidence/generated/tauri-portable-linux-x64/ElectroSchemeSpikeTauri
      - name: Electron launch smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: spikes
        shell: pwsh
        run: |
          $env:SPIKE_SMOKE='1'
          $p=Start-Process -FilePath '.\evidence\generated\electron-package\ElectroSchemeSpikeElectron-win32-x64\ElectroSchemeSpikeElectron.exe' -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force; throw 'Electron smoke timeout'}
          if($p.ExitCode -ne 0){throw "Electron exit $($p.ExitCode)"}
      - name: Tauri launch smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: spikes
        shell: pwsh
        run: |
          $env:SPIKE_SMOKE='1'
          $p=Start-Process -FilePath '.\evidence\generated\tauri-portable-win32-x64\ElectroSchemeSpikeTauri.exe' -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force; throw 'Tauri smoke timeout'}
          if($p.ExitCode -ne 0){throw "Tauri exit $($p.ExitCode)"}
      - name: Record artifact measurements
        shell: python
        run: |
          import json, pathlib, platform
          root=pathlib.Path('spikes')
          paths=[root/'evidence'/'generated'/'electron-package', root/'evidence'/'generated'/f"tauri-portable-{'win32' if platform.system()=='Windows' else 'linux'}-x64"]
          def size(p): return sum(f.stat().st_size for f in p.rglob('*') if f.is_file()) if p.exists() else 0
          out={'runner_os':platform.platform(),'python':platform.python_version(),'candidate_sizes_bytes':{'electron':size(paths[0]),'tauri_portable':size(paths[1])},'measurement_scope':'CI output tree; not universal runtime benchmark'}
          d=root/'evidence'/'generated';d.mkdir(parents=True,exist_ok=True);(d/f'measurements-{platform.system().lower()}.json').write_text(json.dumps(out,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-spike-${{ runner.os }}-${{ runner.arch }}
          path: |
            spikes/evidence/generated/**
            spikes/tauri/src-tauri/Cargo.lock
          if-no-files-found: error
