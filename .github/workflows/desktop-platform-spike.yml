name: Desktop Platform Spike Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'architecture/desktop-platform-and-core-spike-001'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/desktop-platform-and-core-spike-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Generate canonical dependency locks
        run: |
          cd spikes
          npm install --package-lock-only --ignore-scripts
          cd tauri/src-tauri
          cargo generate-lockfile
      - name: Generate neutral reproducible spike icon resources
        shell: bash
        run: |
          mkdir -p spikes/tauri/src-tauri/icons
          cat > spikes/tauri/src-tauri/generate_spike_icons.py <<'PY'
          #!/usr/bin/env python3
          """Generate neutral deterministic spike-only Tauri icons using Python stdlib."""
          from __future__ import annotations
          import argparse, binascii, hashlib, struct, zlib
          from pathlib import Path

          SIZE = 64
          BG = (72, 78, 86, 255)
          GRID = (101, 109, 119, 255)
          MARK = (224, 228, 233, 255)

          def pixels() -> bytes:
              output = bytearray()
              for y in range(SIZE):
                  for x in range(SIZE):
                      color = BG
                      if x % 16 == 0 or y % 16 == 0:
                          color = GRID
                      if (29 <= x <= 34 and 14 <= y <= 49) or (14 <= x <= 49 and 29 <= y <= 34):
                          color = MARK
                      output.extend(color)
              return bytes(output)

          def chunk(kind: bytes, data: bytes) -> bytes:
              checksum = binascii.crc32(kind + data) & 0xffffffff
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', checksum)

          def png_bytes() -> bytes:
              raw = pixels()
              rows = b''.join(b'\x00' + raw[y * SIZE * 4:(y + 1) * SIZE * 4] for y in range(SIZE))
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', SIZE, SIZE, 8, 6, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(rows, level=9))
                      + chunk(b'IEND', b''))

          def ico_bytes(png: bytes) -> bytes:
              header = struct.pack('<HHH', 0, 1, 1)
              entry = struct.pack('<BBBBHHII', SIZE, SIZE, 0, 0, 1, 32, len(png), 22)
              return header + entry + png

          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument('output_dir', type=Path)
              args = parser.parse_args()
              args.output_dir.mkdir(parents=True, exist_ok=True)
              png = png_bytes()
              outputs = {'icon.png': png, 'icon.ico': ico_bytes(png)}
              for name, data in outputs.items():
                  (args.output_dir / name).write_bytes(data)
                  print(f'{name} {hashlib.sha256(data).hexdigest()} {len(data)}')

          if __name__ == '__main__':
              main()
          PY
          python spikes/tauri/src-tauri/generate_spike_icons.py spikes/tauri/src-tauri/icons
          cat > spikes/tauri/src-tauri/icons/README.md <<'EOF'
          # Tauri spike icon resources

          These neutral temporary resources are required by `tauri::generate_context!()` for the architecture spike. They are not an accepted product logo or branding asset.

          Reproduce from the parent directory with:

          ```bash
          python generate_spike_icons.py icons
          ```

          Expected SHA-256:

          ```text
          b3043d8684afb3e5673517816737a29e5e95fad027201f04a604c11b94c5adc5  icon.png
          70fe1e09bfa9206748eecc84f979290a97090aed674fe343615d92471641f05a  icon.ico
          ```

          `icon.png` is required by Linux context generation and `icon.ico` by Windows resource generation even with `--no-bundle`. No `.icns` or production installer branding set is included because those are outside this spike.
          EOF
      - name: Pin the spike-only icon resource contract
        shell: python
        run: |
          import json, pathlib
          path = pathlib.Path('spikes/tauri/src-tauri/tauri.conf.json')
          data = json.loads(path.read_text())
          data['bundle'] = {'active': False, 'icon': ['icons/icon.png', 'icons/icon.ico']}
          path.write_text(json.dumps(data, indent=2) + '\n')
      - name: Capture npm security finding
        working-directory: spikes
        shell: bash
        run: |
          mkdir -p evidence/generated
          set +e
          npm audit --json > evidence/generated/npm-audit-bootstrap.json
          status=$?
          set -e
          printf '%s\n' "$status" > evidence/generated/npm-audit-bootstrap-exit-code.txt
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-spike-bootstrap-locks-and-audit
          path: |
            spikes/package-lock.json
            spikes/tauri/src-tauri/Cargo.lock
            spikes/evidence/generated/npm-audit-bootstrap.json
            spikes/evidence/generated/npm-audit-bootstrap-exit-code.txt
            spikes/tauri/src-tauri/icons/**
          if-no-files-found: error
      - name: Commit canonical locks and reproducible resources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spikes/package-lock.json spikes/tauri/src-tauri/Cargo.lock spikes/tauri/src-tauri/tauri.conf.json spikes/tauri/src-tauri/generate_spike_icons.py spikes/tauri/src-tauri/icons
          git commit -m "Commit reproducible spike locks and neutral Tauri resources"
          git push origin HEAD:architecture/desktop-platform-and-core-spike-001
