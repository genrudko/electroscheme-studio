schema_version: 1
program:
  id: ELECTROSCHEME-STUDIO-PROGRAM-001
  title: ElectroScheme Studio product implementation program
  status: active
  baseline_main: 6e1209d800c0cc65da4a922506586d5a100c2a84
  current_work_item: PROJECT-REFOUNDATION-001
  current_issue: 1
  current_branch: governance/project-refoundation-001
  product_mode:
    standalone: true
    eod_module: false
    desktop_first: true
    local_first: true
    required_platforms: [windows, linux]

principles:
  - id: GITHUB_CANONICAL
    statement: GitHub is the only canonical source for code, plans, decisions, evidence and release state.
  - id: PROTOTYPE_QUARANTINE
    statement: Prototype assets are not inherited by default; reuse requires explicit classification, tests and owner acceptance.
  - id: DOMAIN_OVER_DRAWING
    statement: The engineering document model is authoritative; SVG and UI nodes are projections.
  - id: ONE_DOCUMENT_MODEL
    statement: Runtime components share one versioned canonical document contract.
  - id: COMMAND_MUTATIONS
    statement: User-visible changes use command/transaction semantics compatible with undo and redo.
  - id: CROSS_PLATFORM_REQUIRED
    statement: Windows and Linux are mandatory acceptance targets.
  - id: SOURCE_PROVENANCE
    statement: Imported and generated symbols retain source and review provenance.
  - id: PROVEN_COMPLIANCE
    statement: GOST/STO claims require identified sources, encoded scope and evidence.
  - id: SPECIALIZED_ADVANTAGE
    statement: Product advantage is measured in electrical-engineering workflows, not universal CAD feature count.

prototype_asset_dispositions:
  - retain_as_reference
  - salvage_after_tests
  - reimplement_from_contract
  - retire

default_dispositions:
  ui_css: reimplement_from_contract
  interaction_code: reimplement_from_contract
  document_state_models: reimplement_from_contract
  vsdx_source_data: retain_as_reference
  extracted_shapesheet_metrics: salvage_after_tests
  normative_research: retain_as_reference
  generated_symbol_drafts: salvage_after_tests

statuses: [not_started, blocked, in_progress, candidate, accepted, deferred]

phases:
  - id: P0_PROJECT_REFOUNDATION
    title: Project refoundation and GitHub governance
    status: in_progress
    work_item: PROJECT-REFOUNDATION-001
    depends_on: []
    objective: Establish the canonical product, architecture, quarantine and execution contract.
    deliverables:
      - documentation index
      - factual current-state baseline
      - product scope
      - MVP/demo/pilot scenarios
      - target architecture
      - domain invariants
      - acceptance gates
      - desktop-first ADR
      - prototype quarantine policy
      - next work-item definition
    gates:
      - documentation_consistency
      - no_product_code_changes
      - owner_acceptance

  - id: P1_MARKET_AND_WORKFLOW_BASELINE
    title: Market and electrical-workflow analysis
    status: not_started
    depends_on: [P0_PROJECT_REFOUNDATION]
    objective: Convert competitor and user-workflow research into measurable product requirements without copying general-purpose editors blindly.
    deliverables:
      - competitor capability matrix
      - pain-point inventory
      - electrical workflow map
      - must_match_must_exceed_not_needed decisions
      - updated MVP acceptance priorities
    gates:
      - source_traceability
      - owner_product_acceptance

  - id: P2_DESKTOP_PLATFORM_AND_CORE_SPIKE
    title: Desktop platform and canonical core spike
    status: blocked
    work_item: DESKTOP-PLATFORM-AND-CORE-SPIKE-001
    depends_on: [P0_PROJECT_REFOUNDATION]
    objective: Select the desktop/runtime architecture using executable Windows/Linux evidence and classify every prototype asset.
    compare:
      - packaging and startup
      - filesystem and native dialogs
      - clipboard and drag_drop
      - SVG pointer zoom and large-document performance
      - printing and PDF
      - updater and signing path
      - Python VSDX tooling integration
      - automated testability
      - runtime size and maintenance burden
    deliverables:
      - executable candidate spikes
      - comparative evidence matrix
      - full prototype asset inventory
      - disposition and migration map
      - ADR selecting desktop shell and runtime boundaries
      - target repository layout
      - canonical schema ownership decision
    gates:
      - windows_smoke
      - linux_smoke
      - equivalent_editor_scenario
      - no_unreviewed_prototype_reuse
      - owner_architecture_acceptance

  - id: P3_CANONICAL_DOCUMENT_CORE
    title: Canonical document storage and command core
    status: not_started
    depends_on: [P2_DESKTOP_PLATFORM_AND_CORE_SPIKE]
    objective: Implement one versioned document model and deterministic mutation/persistence path independent of the full UI.
    deliverables:
      - project document schema v1
      - sheets layers objects ports connections properties
      - stable IDs and references
      - command transaction interface
      - undo_redo journal
      - deterministic serializer
      - project migrations
      - new_open_save services
      - round_trip and invariant tests
    gates:
      - schema_validation
      - deterministic_round_trip
      - migration_tests
      - command_undo_redo_tests
      - core_tests_without_full_UI

  - id: P4_EDITOR_KERNEL_AND_DESIGN_SYSTEM
    title: Editor kernel and fresh product design system
    status: not_started
    depends_on: [P1_MARKET_AND_WORKFLOW_BASELINE, P3_CANONICAL_DOCUMENT_CORE]
    objective: Build maintainable interactions and a new accepted UX/design foundation rather than repairing prototype UI.
    deliverables:
      - interaction specification
      - design tokens and component system
      - renderer projection layer
      - viewport and coordinate transforms
      - zoom pan selection multi_selection
      - move rotate copy delete
      - reference_point insertion
      - grid rulers guides snapping
      - layers and properties adapters
      - command integration for every mutation
      - autosave dirty_state and recovery baseline
    gates:
      - interaction_tests
      - desktop_e2e
      - undo_redo_for_primary_operations
      - performance_baseline
      - visual_regression
      - owner_visual_acceptance

  - id: P5_SYMBOL_PLATFORM
    title: Reviewed electrical symbol platform
    status: not_started
    depends_on: [P3_CANONICAL_DOCUMENT_CORE, P4_EDITOR_KERNEL_AND_DESIGN_SYSTEM]
    objective: Convert source data into accepted parameterized engineering object families.
    first_object_families:
      - busbar
      - circuit_breaker
      - disconnector
      - earthing_switch
      - load_break_switch
      - power_transformer
      - current_transformer
      - voltage_transformer
      - surge_arrester
      - line_or_cable
      - source_or_incomer
      - title_block
    deliverables:
      - symbol definition schema
      - normalized VSDX ShapeSheet import path
      - provenance and review workflow
      - geometry dimensions ports rotation snap tests
      - state and parameter contracts
      - accepted MVP library
    gates:
      - no_auto_promotion
      - source_traceability
      - visual_geometry_acceptance
      - port_rotation_snap_acceptance
      - save_load_export_acceptance

  - id: P6_ELECTRICAL_TOPOLOGY
    title: Electrical connections and topology services
    status: not_started
    depends_on: [P3_CANONICAL_DOCUMENT_CORE, P4_EDITOR_KERNEL_AND_DESIGN_SYSTEM, P5_SYMBOL_PLATFORM]
    objective: Implement electrical connectivity as a model independent from rendered paths.
    deliverables:
      - port_to_port connections
      - busbar and bay_slot attachment
      - orthogonal route representation
      - manual waypoints
      - junction and crossing semantics
      - topology preservation on transforms
      - diagnostics and delete policies
    gates:
      - topology_invariants
      - transform_preservation
      - deterministic_route_serialization
      - diagnostic_tests

  - id: P7_MVP_VERTICAL_SLICE
    title: Complete normal-scheme MVP vertical slice
    status: not_started
    depends_on: [P4_EDITOR_KERNEL_AND_DESIGN_SYSTEM, P5_SYMBOL_PLATFORM, P6_ELECTRICAL_TOPOLOGY]
    objective: Complete the end-to-end scenario defined in MVP_AND_DEMO.md.
    deliverables:
      - new project and sheets
      - accepted object set
      - editing and topology
      - validation
      - save close reopen edit
      - SVG and PDF
      - printing
      - crash recovery baseline
    gates:
      - complete_MVP_scenario
      - windows_acceptance
      - linux_acceptance
      - no_data_loss
      - owner_acceptance

  - id: P8_GOST_STO_PROFILES_AND_OUTPUT
    title: GOST STO profiles validation and release output
    status: not_started
    depends_on: [P7_MVP_VERTICAL_SLICE]
    objective: Make normative presentation and output evidence-based and reproducible.
    deliverables:
      - normative source register
      - profile rules
      - validation rule catalog
      - frames title_blocks line_text_color profiles
      - print and export conformance fixtures
    gates:
      - source_cited_rules
      - visual_golden_tests
      - print_dimension_tests
      - no_unqualified_full_compliance_claim

  - id: P9_PACKAGING_DEMO_AND_PILOT
    title: Cross-platform packaging demo and pilot
    status: not_started
    depends_on: [P7_MVP_VERTICAL_SLICE, P8_GOST_STO_PROFILES_AND_OUTPUT]
    objective: Deliver installable Windows/Linux builds and validate a real working scenario.
    deliverables:
      - Windows package
      - Linux package
      - update and rollback procedure
      - release notes and known limitations
      - demo evidence D1_D7
      - pilot project and feedback register
    gates:
      - clean_machine_install
      - same_project_cross_platform_round_trip
      - signed_or_verifiable_artifacts
      - demo_acceptance
      - pilot_acceptance

  - id: P10_ADVANCED_PRODUCT_CAPABILITIES
    title: Post-MVP specialized advantages
    status: not_started
    depends_on: [P9_PACKAGING_DEMO_AND_PILOT]
    objective: Add advanced capabilities only from validated user and market priorities.
    candidates:
      - reusable_bay_templates
      - advanced_transformer_winding_models
      - automatic_numbering
      - equipment_registers
      - reusable_fragments
      - advanced_routing
      - revision_comparison
      - topology_driven_generation
      - external_system_adapters
      - optional_viewer_or_web_profile

next_work_item:
  id: DESKTOP-PLATFORM-AND-CORE-SPIKE-001
  create_after: P0_PROJECT_REFOUNDATION accepted and merged
  rule: Do not begin feature development before this spike selects the architecture and completes prototype asset dispositions.
